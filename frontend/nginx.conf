server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a /api se reenvían a la API en Go (servicio "api" de docker-compose).
    location /api/ {
        proxy_pass http://api:8082;
    }

    # Cualquier otra ruta devuelve index.html: React Router decide qué pantalla dibujar.
    location / {
        try_files $uri /index.html;
    }
}
